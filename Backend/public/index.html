.wrap{width:100%;max-width:1200px;margin:0 auto;padding:32px 6vw;display:flex;gap:48px;align-items:center;justify-content:space-between}
.hero{flex:1;min-width:0;align-self:flex-start;padding-top:4vh}
.hero small{display:block;font-size:20px;letter-spacing:.08em;font-weight:500}
.hero h1{margin:4px 0 18px;font-size:clamp(44px,7vw,84px);line-height:.98;font-weight:800;letter-spacing:-.01em}
.hero h2{margin:0 0 10px;font-size:clamp(18px,2.2vw,24px);font-weight:500;max-width:18ch}
.hero p{margin:0;font-size:13px;max-width:34ch;opacity:.92}
.card{width:100%;max-width:380px;padding:28px 26px;border-radius:22px;background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 40px rgba(10,20,60,.25)}
.logo{text-align:center;font-size:28px;font-weight:800;letter-spacing:-.01em;margin-bottom:18px}
.logo span{color:#9fb3ff}
label{display:block;font-size:14px;margin:12px 0 6px}
.field{position:relative}
input{width:100%;height:42px;border-radius:10px;border:1px solid var(--glass-b);background:var(--field);color:var(--ink);padding:0 14px;font-size:14px;outline:none}
input::placeholder{color:rgba(255,255,255,.75)}
input:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--ink);font-size:12px;cursor:pointer;padding:6px}
.forgot{text-align:right;margin:6px 0 14px;font-size:12px}
a{color:var(--ink)}
.btn{width:100%;height:44px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;letter-spacing:.04em;cursor:pointer}
.btn:hover{background:var(--accent-h)}
.or{display:flex;align-items:center;gap:10px;margin:16px 0;font-size:12px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--glass-b)}
.google{width:100%;height:42px;border-radius:10px;border:1px solid var(--glass-b);background:transparent;color:var(--ink);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.google:hover{background:var(--field)}
.g{font-weight:800;font-size:16px}
.new{text-align:center;font-size:14px;margin:16px 0 0}
.msg{min-height:18px;font-size:12px;margin-top:10px;color:var(--err);text-align:center}
@media (max-width:820px){.wrap{flex-direction:column;align-items:stretch;gap:28px;padding:28px 20px}.hero{padding-top:0}.card{max-width:none}}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <small>TRAVEL</small>
    <h1>EXPLORE<br>HORIZONS</h1>
    <h2>Where Solo Travelers Become Travel Partners</h2>
    <p>Match with people heading to the same destination on the same dates, then plan the trip together.</p>
  </section>
  <section class="card" aria-label="Sign in">
    <div class="logo">Solo<span>Trip</span> Match</div>
    <form id="f" novalidate>
      <div id="nameWrap" style="display:none"><label for="name">Full Name</label><div class="field"><input id="name" type="text" placeholder="Enter your full name" autocomplete="name"></div></div>
      <label for="email">Email</label>
      <div class="field"><input id="email" type="email" placeholder="Enter your email" autocomplete="email"></div>
      <label for="pw">Password</label>
      <div class="field">
        <input id="pw" type="password" placeholder="Enter your password" autocomplete="current-password">
        <button type="button" class="eye" id="eye" aria-label="Show password">Show</button>
      </div>
      <div class="forgot"><a href="#forgot">Forgot Password</a></div>
      <button class="btn" type="submit" id="go">SIGN IN</button>
      <div class="msg" id="msg" role="alert"></div>
    </form>
        <p class="new"><span id="sw">Are you new?</span> <a href="#" id="toggle">Create an Account</a></p>
  </section>
</main>
<script>
var pw=document.getElementById('pw'),eye=document.getElementById('eye'),msg=document.getElementById('msg'),reg=false;
eye.addEventListener('click',function(){var s=pw.type==='password';pw.type=s?'text':'password';eye.textContent=s?'Hide':'Show';});
document.getElementById('toggle').addEventListener('click',function(e){
  e.preventDefault();reg=!reg;
  document.getElementById('nameWrap').style.display=reg?'block':'none';
  document.getElementById('go').textContent=reg?'CREATE ACCOUNT':'SIGN IN';
  document.getElementById('sw').textContent=reg?'Already have an account?':'Are you new?';
  this.textContent=reg?'Sign In':'Create an Account';msg.textContent='';
});
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();
  var em=document.getElementById('email').value.trim(),name=document.getElementById('name').value.trim();
  if(reg&&!name){msg.textContent='Enter your full name.';return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){msg.textContent='Enter a valid email address.';return;}
  if(pw.value.length<6){msg.textContent='Password must be at least 6 characters.';return;}
  msg.textContent='';
  try{
    var r=await fetch('/api/auth/'+(reg?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({full_name:name,email:em,password:pw.value})});
    var d=await r.json();
    if(!r.ok){msg.textContent=d.error||'Something went wrong.';return;}
    localStorage.setItem('token',d.token);location.href='/app.html';
  }catch(err){msg.textContent='Cannot reach the server.';}
});
</script>
</body>
</html>
